<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .block,
    .inline,
    .inline_block {
        font-weight: bold;
        font-family: sans-serif;
    }
    .block {
        background-color: lightblue;
        display: block;
        padding: 10px;
        height: 100px;
        width: 100px;
        margin: 10px;
        border: 10px solid red;
    }
    .inline {
        background-color: lightgreen;
        display: inline;
        padding: 10px;
        height: 100px;
        width: 100px;
        margin-top: 10px;
        margin-bottom: 30px;
        border: 10px solid red;
    }
    .inline_block {
        background-color: mediumorchid;  
        display: inline-block;
        padding: 10px;
        height: 100px;
        width: 100px;
        margin: 10px;
        border: 10px solid red;
    }
</style>

<body>
    <h2>hello from h2</h2>
    <div class="block">Hello Hi how are you</div>
    <div class="block">Hello Hi how are you</div>
    <div class="inline">I am inline</div>
    <div class="inline">I am inline</div>
    <div class="inline_block">I am inline block</div>
    <div class="inline_block">I am inline block</div>
    <div class="inline">I am inline</div>
</body>

</html>
