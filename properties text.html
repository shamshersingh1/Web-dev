<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            font-size: larger;
            font-weight: 400;
            font-style: italic;
            font-display: fallback;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            text-transform: lowercase;
        }
        .strike{
            text-decoration: underline;
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>Css Properties</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Illum, deserunt.</p>
    <p class="strike">i am strike</p>
</body>
</html>
